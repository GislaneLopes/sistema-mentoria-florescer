<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Mentoria Florescer</title>

    <meta
        name="description"
        content="Sistema de Mentoria Florescer - plataforma de acompanhamento de mentorias."
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="app-container">

        <header class="app-header">
            <div>
                <p class="app-kicker">MENTORIA</p>
                <h1>Florescer</h1>
                <p class="app-subtitle">
                    Seu espaço de acompanhamento, desenvolvimento e evolução.
                </p>
            </div>
        </header>

        <section class="welcome-card">

            <div class="welcome-content">
                <span class="welcome-badge">🌷 Sistema de Mentoria</span>

                <h2>Bem-vinda ao Florescer</h2>

                <p>
                    Um espaço criado para acompanhar metas, objetivos,
                    ações, progresso e momentos importantes da sua jornada.
                </p>

                <button type="button" id="btnEntrar">
                    Entrar no sistema
                </button>
            </div>

        </section>

        <section class="status-card" id="statusCard">
            <h3>Status do sistema</h3>
            <p id="statusMessage">
                Preparando o sistema...
            </p>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
